<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password · IT Support</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="stylesheet" href="/static/css/shared.css?v=admin-tools-27">

<style>
.password-page{min-height:100vh;background:radial-gradient(circle at 15% 5%,rgba(75,85,99,.06),transparent 28%),linear-gradient(180deg,var(--bg-accent),var(--bg));}
.password-head{color:#fff;padding:22px 0 78px;background:radial-gradient(circle at 8% 0%,rgba(75,85,99,.14),transparent 28%),radial-gradient(circle at 92% 20%,rgba(47,155,110,.1),transparent 25%),linear-gradient(135deg,var(--header),var(--header-2));border-radius:0 0 46% 46%/0 0 30px 30px;box-shadow:0 16px 42px rgba(15,23,42,.14);}
.password-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.password-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;}
.password-logo{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 28px rgba(15,23,42,.22),inset 0 1px 0 rgba(255,255,255,.23);overflow:hidden;}
.password-logo img{width:39px;height:39px;object-fit:contain;display:block;transform:translateX(4px);}
.password-brand-copy small{display:block;color:#E2E7EC;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;}
.password-brand-copy b{display:block;margin-top:3px;font-size:15px;letter-spacing:.05em;}
.password-back{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:11px;color:#fff;text-decoration:none;font-size:11px;font-weight:850;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);}
.password-wrap{width:min(760px,calc(100% - 32px));margin:26px auto 0;position:relative;z-index:2;padding-bottom:52px;}
.password-card{display:block;background:var(--surface);border:1px solid var(--border-strong);border-radius:26px;overflow:hidden;box-shadow:0 26px 70px rgba(15,23,42,.18),0 8px 20px rgba(15,23,42,.08);animation:v36-card-in .55s cubic-bezier(.22,.8,.2,1) both;}
.password-card-head{padding:26px 28px 20px;background:linear-gradient(145deg,var(--surface-2),var(--surface));border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;}
.password-title-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary-soft-text);border:1px solid color-mix(in srgb,var(--primary) 20%,var(--border));box-shadow:var(--shadow-sm);flex:none;}
.password-title-icon svg{width:21px;height:21px;}
.password-card-head .eyebrow{font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);}
.password-card-head h1{margin:6px 0 4px;font-size:25px;line-height:1.1;letter-spacing:-.035em;}
.password-card-head p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5;}
.password-account{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 28px;padding:14px 0;border-bottom:1px solid var(--border);}
.password-account-left{display:flex;align-items:center;gap:10px;}
.password-avatar{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary-soft-text);font-size:10px;font-weight:900;}
.password-account small{display:block;color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:900;}
.password-account b{display:block;margin-top:2px;font-size:11px;}
.password-main{padding:24px 28px 28px;background:var(--surface);}
.password-main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.password-main-head h2{margin:0;font-size:14px;}
.password-main-head span{color:var(--muted);font-size:9.5px;line-height:1.45;text-align:right;max-width:260px;}
.password-alert{margin-bottom:12px;}
.password-form{display:grid;gap:13px;}
.password-field{display:grid;gap:6px;}
.password-field label{font-size:10px;font-weight:900;letter-spacing:.04em;color:var(--text-soft);}
.password-control{position:relative;}
.password-control input{width:100%;padding-right:58px;min-height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);}
.password-control input:focus{background:var(--surface);}
.password-toggle{position:absolute;top:50%;right:7px;transform:translateY(-50%);min-width:40px;height:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:9.5px;font-weight:800;}
.password-meter{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:4px;}
.password-meter > span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);transition:width .2s ease;}
.password-status{font-size:9px;color:var(--muted);}
.password-actions{display:flex;gap:8px;margin-top:6px;}
.password-actions a,.password-actions button{min-height:44px;flex:1;border-radius:11px;}
.password-actions a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft);font-size:11px;font-weight:800;}
.password-actions button{background:var(--action);box-shadow:0 8px 18px rgba(15,118,110,.18);}
.password-foot{margin-top:13px;color:var(--muted);font-size:9px;line-height:1.45;text-align:center;}
.password-tips{display:flex;gap:8px;flex-wrap:wrap;margin:0 28px;padding:14px 0 2px;}
.password-tip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;color:var(--muted);font-size:9px;}
.password-tip i{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.12);flex:none;}
@keyframes v36-card-in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:760px){.password-wrap{width:min(100% - 22px,640px);margin:20px auto 0}.password-head{padding-bottom:58px;border-radius:0 0 34% 34%/0 0 24px 24px}.password-card-head,.password-main{padding-left:20px;padding-right:20px}.password-account,.password-tips{margin-left:20px;margin-right:20px}.password-main-head{align-items:flex-start;flex-direction:column}.password-main-head span{text-align:left;max-width:none}.password-actions{flex-direction:column}.password-tips{gap:6px}.password-back{font-size:10px;min-height:36px;}}
</style>
<link rel="stylesheet" href="/static/css/ui-density.css?v=admin-tools-27">
<script src="/static/js/ui-controls.js?v=admin-tools-27" defer></script>
<link rel="stylesheet" href="/static/css/site-scale.css?v=r53">
</head><body>
<div class="password-page"><header class="password-head"><div class="wrap password-nav">
<a class="password-brand" href="/"><span class="password-logo"><img src="/static/polo-mark.png" alt="POLO"></span><span class="password-brand-copy"><small>IT Operations</small><b>POLO INDONESIA</b></span></a>
<a class="password-back" href="/">Back to dashboard</a></div></header>
<main class="password-wrap"><section class="password-card">
<div class="password-card-head"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change Password</h1><p>Update the password used for your IT Support account.</p></div></div>
<div class="password-account"><div class="password-account-left"><div class="password-avatar" id="password-avatar">--</div><div><small>Signed in as</small><b id="password-display">Loading…</b></div></div><span id="password-role" class="password-foot"></span></div>
<div class="password-main"><div id="password-alert" class="password-alert" hidden></div>
<form class="password-form" method="post" action="/password" id="password-form"><input type="hidden" name="csrf" id="csrf">
<div class="password-field"><label for="old">Current password</label><div class="password-control"><input id="old" name="old" type="password" required autocomplete="current-password"><button type="button" class="password-toggle" data-target="old">Show</button></div></div>
<div class="password-field"><label for="new">New password</label><div class="password-control"><input id="new" name="new" type="password" required autocomplete="new-password"><button type="button" class="password-toggle" data-target="new">Show</button></div><div class="password-meter"><span id="password-meter-fill"></span></div><div id="password-status" class="password-status"></div></div>
<div class="password-field"><label for="confirm">Confirm new password</label><div class="password-control"><input id="confirm" name="confirm" type="password" required autocomplete="new-password"><button type="button" class="password-toggle" data-target="confirm">Show</button></div></div>
<div class="password-actions"><a href="/">Cancel</a><button type="submit">Update Password</button></div></form></div>
</section></main></div><script src="/static/js/ui.js?v=admin-tools-27" defer></script><script src="/static/js/password.js?v=admin-tools-27" defer></script></body></html>
